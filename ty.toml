[src]
# Type-check application code only. Tests, scripts, migrations, and the
# evaluation toolkit have looser typing requirements (mocks, ad-hoc CLIs,
# generated DDL), and matching ruff/bandit's per-file-ignore convention.
exclude = [
    "tests/**",
    "scripts/**",
    "src/app/persistence/migrations/**",
    "data/**",
    "config/**",
    "frontend/**",
    "docker/**",
    ".venv/**",
]

[rules]
# ty 0.0.21 is alpha — its bundled stubs for arq, langgraph, aiogram,
# pydantic, redis-py, and parts of SQLAlchemy 2.0 lag behind real-world
# usage, producing structural false positives. The rules below all fire
# overwhelmingly on stub-coverage gaps in this codebase rather than real
# bugs; demoting to "warn" keeps them visible for new code. CI uses
# `--exit-zero-on-warning`, so any error-level diagnostic still fails the
# build. Restore these rules to "error" as the relevant stubs catch up.
#
# Concrete patterns observed:
#   - invalid-argument-type: arq's `cron(async_fn)`, langgraph's
#     `StateGraph(PydanticModel)`, dict[str, Any] vs TypedDict mismatches.
#   - unresolved-attribute: SQLAlchemy 2.0 Mapped[] columns, hasattr()-
#     narrowed Protocol arguments, mock attribute access in tests.
#   - invalid-await: redis-py async client where `Redis | None` isn't
#     narrowed by `if self._redis:` guards.
#   - unknown-argument: Pydantic models declared with Field(alias=...) —
#     ty's pydantic stubs don't see aliased fields as __init__ args.
#   - not-iterable: hasattr()-narrowed `body_iterator` on Starlette
#     Response objects.
#   - call-non-callable: SQLAlchemy result.scalars().all() chains where
#     ty types intermediate steps as `object`.
invalid-argument-type = "warn"
unresolved-attribute = "warn"
invalid-await = "warn"
unknown-argument = "warn"
not-iterable = "warn"
call-non-callable = "warn"
no-matching-overload = "warn"

# Additional alpha-tool gaps surfaced by `ty check`:
#   - missing-argument: pydantic-settings `BaseSettings()` constructed
#     with no kwargs (values come from env vars at runtime — ty's stubs
#     don't model this, so it sees ~13 "required" fields per call).
#   - invalid-return-type: SQLAlchemy 2.0 result chains (`result.one()`,
#     `scalar_one_or_none()`) typed as `~None | Row`; ty's narrowing
#     after `if x is not None` doesn't propagate. Also fires on
#     `isinstance(value, dict)` narrowing returning `Top[dict[Unknown,
#     Unknown]]` instead of the declared `dict[str, Any]`.
#   - invalid-assignment: TypedDict subscript assignment where the RHS
#     is a `dict[Unknown, Unknown]` rather than the exact declared
#     value-type — narrowing limitation, not a real type confusion.
#   - invalid-type-form: type annotations referencing classes imported
#     under `if TYPE_CHECKING:` from optional dependencies (anthropic
#     SDK), which ty resolves to `Never`.
#   - invalid-method-override: stdlib signature compatibility checks
#     that flag `*args: Any` overrides as structurally incompatible
#     with named-parameter base methods (e.g. BaseHTTPRequestHandler).
#   - unresolved-import: lazy/optional imports inside `try/except
#     ImportError` blocks (sklearn for KMeans clustering).
missing-argument = "warn"
invalid-return-type = "warn"
invalid-assignment = "warn"
invalid-type-form = "warn"
invalid-method-override = "warn"
unresolved-import = "warn"
