name: Bug report
description: Report a reproducible defect without including private workspace data
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, database content, personal records, provider IDs, or unredacted logs. Report security vulnerabilities through the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Tag or commit hash where the problem occurs.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Docker Compose on Linux
        - Docker Compose on macOS
        - Docker Compose through WSL 2
        - Development environment
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include exact, redacted error text when useful.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use fictional or disposable data only.
      placeholder: |
        1. Start from...
        2. Open...
        3. Select...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Docker and Compose versions, and browser.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal data, provider identifiers, and private logs.
          required: true
        - label: This is not a security vulnerability.
          required: true
