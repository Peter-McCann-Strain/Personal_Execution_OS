name: personal-execution-os

x-backend-build: &backend-build
  context: .
  dockerfile: docker/Dockerfile
  args:
    APP_VERSION: ${APP_VERSION:-0.1.1}
    SOURCE_REPOSITORY_URL: ${VITE_SOURCE_REPOSITORY_URL:-https://github.com/Peter-McCann-Strain/Personal_Execution_OS}
    SOURCE_REVISION: ${SOURCE_REVISION:-local}

x-backend-environment: &backend-environment
  APP_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://assistant_runtime:${POSTGRES_PASSWORD:?Run ./scripts/start.sh first}@postgres:5432/personal_execution_os
  DB_PGBOUNCER_MODE: "false"
  REDIS_URL: redis://redis:6379/0
  CHAT_API_KEY: ${CHAT_API_KEY:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OTEL_EXPORT_CONTENT: ${OTEL_EXPORT_CONTENT:-false}
  OLLAMA_HOST: ${OLLAMA_HOST:-}
  USER_TIMEZONE: ${USER_TIMEZONE:-UTC}
  CORS_ALLOWED_ORIGINS: ""
  # Set true whenever APP_ADDRESS/edge proxy serves HTTPS.
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
  PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
  APP_PORT: ${APP_PORT:-8080}
  EVALUATION_EXPORT_DIR: /var/lib/personal-execution-os/evaluation/exports
  SPOTCHECK_DIR: /var/lib/personal-execution-os/evaluation/spotcheck
  DATASET_PROPOSALS_DIR: /var/lib/personal-execution-os/evaluation/datasets/proposals
  DATASET_DATASETS_DIR: /var/lib/personal-execution-os/evaluation/datasets
  PROACTIVE_AUTOMATION_ENABLED: ${PROACTIVE_AUTOMATION_ENABLED:-false}
  SESSION_MAINTENANCE_ENABLED: ${SESSION_MAINTENANCE_ENABLED:-false}
  AUTO_JUDGE_ENABLED: ${AUTO_JUDGE_ENABLED:-false}
  QUALITY_ALERTS_ENABLED: ${QUALITY_ALERTS_ENABLED:-false}
  SLO_ALERTS_ENABLED: ${SLO_ALERTS_ENABLED:-false}
  EVAL_EXPORT_ENABLED: ${EVAL_EXPORT_ENABLED:-false}
  SPOTCHECK_ENABLED: ${SPOTCHECK_ENABLED:-false}
  DLQ_ALERT_ENABLED: ${DLQ_ALERT_ENABLED:-false}
  EVAL_PIPELINE_ENABLED: ${EVAL_PIPELINE_ENABLED:-false}
  ASSISTANT_NATIVE_REPLAY_EVAL_ENABLED: ${ASSISTANT_NATIVE_REPLAY_EVAL_ENABLED:-false}
  DATASET_CURATION_ENABLED: ${DATASET_CURATION_ENABLED:-false}
  QUALITY_GATES_ALERTS_ENABLED: ${QUALITY_GATES_ALERTS_ENABLED:-false}
  COST_ALERTS_ENABLED: ${COST_ALERTS_ENABLED:-false}
  SCHEMA_DRIFT_ALERTS_ENABLED: ${SCHEMA_DRIFT_ALERTS_ENABLED:-false}
  GITHUB_ISSUE_FILER_ENABLED: ${GITHUB_ISSUE_FILER_ENABLED:-false}

services:
  postgres:
    # pgvector's entrypoint uses gosu for the one-time postgres user drop.
    image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    environment:
      POSTGRES_USER: assistant_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run ./scripts/start.sh first}
      POSTGRES_DB: personal_execution_os
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Run ./scripts/start.sh first}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/start.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./docker/postgres-init.sh
        target: /docker-entrypoint-initdb.d/10-runtime-roles.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U assistant_admin -d personal_execution_os",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7.4.10-alpine3.21@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    build: *backend-build
    command:
      - sh
      - -ec
      - alembic upgrade head && python -m scripts.grant_runtime_role
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql+asyncpg://assistant_migrator:${POSTGRES_MIGRATOR_PASSWORD:?Run ./scripts/start.sh first}@postgres:5432/personal_execution_os
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  api:
    build: *backend-build
    # Backend-only env file forwards optional Settings integrations without
    # exposing credentials to the static web proxy or data services.
    env_file:
      - path: .env
        required: false
    environment: *backend-environment
    volumes:
      - app-data:/var/lib/personal-execution-os
      - type: bind
        source: ./config/IDENTITY.local.md
        target: /app/config/IDENTITY.local.md
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - edge
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  worker:
    build: *backend-build
    command: ["arq", "src.app.workers.main.WorkerSettings"]
    env_file:
      - path: .env
        required: false
    environment: *backend-environment
    volumes:
      - app-data:/var/lib/personal-execution-os
      - type: bind
        source: ./config/IDENTITY.local.md
        target: /app/config/IDENTITY.local.md
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - arq
        - --check
        - src.app.workers.main.WorkerSettings
      interval: 15s
      timeout: 30s
      retries: 8
      start_period: 15s
    restart: unless-stopped
    networks:
      - worker-egress
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_SOURCE_REPOSITORY_URL: ${VITE_SOURCE_REPOSITORY_URL:-}
        APP_VERSION: ${APP_VERSION:-0.1.1}
        SOURCE_REPOSITORY_URL: ${VITE_SOURCE_REPOSITORY_URL:-https://github.com/Peter-McCann-Strain/Personal_Execution_OS}
        SOURCE_REVISION: ${SOURCE_REVISION:-local}
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:8080/",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    restart: unless-stopped
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  app-data:
  postgres-data:
  redis-data:

networks:
  edge:
  worker-egress:
  data:
    internal: true
