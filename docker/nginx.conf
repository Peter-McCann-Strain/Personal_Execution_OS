worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format container '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout container;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;
    gzip on;
    gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain;

    map $uri $execution_os_cache_control {
        default "no-store, no-cache, must-revalidate";
        ~^/assets/ "public, max-age=31536000, immutable";
        ~^/(?:manifest\.webmanifest|icon(?:-maskable)?-(?:192|512)\.png|icon(?:-maskable)?\.svg)$ "public, max-age=86400";
    }

    # Keep temporary files in locations writable by the unprivileged runtime user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    upstream execution_os_api {
        server api:8000;
        keepalive 32;
    }

    include /tmp/nginx-conf.d/*.conf;
}
